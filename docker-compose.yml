version: '3.8'

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: aqar_flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=Asia/Riyadh
    networks:
      - aqar_net

  web:
    build: .
    container_name: aqar_web
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - PORT=8099
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    depends_on:
      - flaresolverr
    networks:
      - aqar_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  aqar_net:
    driver: bridge
